[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffcohesive"
version = "0.1.0"
description = "Differentiable cohesive-zone fracture FEM (2D/3D) with gradient-based identification of analytic and neural-network-based traction-separation laws, built on TensorMesh/PyTorch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Royson Dsouza", email = "royson316@gmail.com" }]
keywords = [
    "cohesive zone model",
    "fracture mechanics",
    "delamination",
    "finite element method",
    "differentiable simulation",
    "automatic differentiation",
    "inverse identification",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.0.0",
    "tensormesh-fem>=0.1.1",
    "torch-sla>=0.2.1",
    "gmsh",
    "meshio",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/roysondsouza316/diffcohesive"
Issues = "https://github.com/roysondsouza316/diffcohesive/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["diffcohesive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
